worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /tmp/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml;

    # Security headers
    add_header X-Frame-Options         "SAMEORIGIN"   always;
    add_header X-Content-Type-Options  "nosniff"      always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # Rate limiting — 30 API requests/min per IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

    upstream flask_app {
        server 127.0.0.1:5000;
        keepalive 16;
    }

    # ── HTTP → redirect to HTTPS ───────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Let Certbot handle its ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS ─────────────────────────────────────────────────────────────────
    # NOTE: Certbot will add ssl_certificate lines automatically when you run it.
    # This block is the template — certbot modifies it in place.
    server {
        listen 443 ssl;
        server_name tuner.yourdomain.com;   # REPLACE with your actual domain

        # Certbot fills these in:
        # ssl_certificate     /etc/letsencrypt/live/tuner.yourdomain.com/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/tuner.yourdomain.com/privkey.pem;
        # include             /etc/letsencrypt/options-ssl-nginx.conf;
        # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

        # Health check — no rate limit, no logging
        location /health {
            access_log off;
            proxy_pass http://flask_app;
        }

        # API — rate limited
        location /api/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass         http://flask_app;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Static assets — cached for 1 day
        location /static/ {
            proxy_pass         http://flask_app;
            add_header         Cache-Control "public, max-age=86400, immutable";
        }

        # Everything else
        location / {
            proxy_pass         http://flask_app;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
